<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Моите задачи">
<meta name="theme-color" content="#000000">
<title>Моите задачи</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Single dark theme by user choice. Layout: HELIOS-style dark band with rounded bottom, gold logo, 2x2 numbers; white quick cards in two groups; upcoming list. Was: navy header band with summary, grid of colored quick tiles (one per unit), upcoming list; each tile opens its own screen */
:root{
  color-scheme:dark;
  --bg:#11161c; --surface:#1a2129; --ink:#e7ecf1; --muted:#97a3b1; --line:#2b3540;
  --accent:#5b8ff5; --accent-ink:#0b1220; --gold:#F2C230; --gold-ink:#1A1400;
  --bad:#ef6b5b; --warn:#e0a84a; --ok:#5cc08a;
  --chip:#242d37;
  --hdr:#000000; --hdr-ink:#ffffff; --hdr-muted:#a3a3ad; --hdr-card:rgba(255,255,255,.09);
  /* цветове на бутоните — едни и същи в двете теми, бял текст */
  --t-obsh:#1f5fa8; --t-babh:#23835a; --t-kzp:#7d48a8; --t-pol:#6F8FD6; --t-sad:#a3401a;
  --t-serv:#c46a12; --t-ice:#0f8a9a; --t-kasa:#b8325a; --t-wash:#3a6fd8; --t-rent:#5b6b2a; --t-meet:#d04f2c; --t-nap:#94A3B8;
  --f-display:"Onest",-apple-system,system-ui,"Segoe UI",sans-serif;
  --f-body:"Onest",-apple-system,system-ui,"Segoe UI",sans-serif;
  --f-num:"Onest",-apple-system,system-ui,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-bottom:100px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
.in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr{background:var(--hdr);color:var(--hdr-ink);border-radius:0 0 24px 24px}
.hdr .in{padding-block:14px 16px;max-width:560px}
.top{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:11px;flex:none;display:block}
.logo svg{width:20px;height:20px}
h1{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0;line-height:1.2;display:flex;align-items:center;gap:10px}
.date{display:block;opacity:.65;font-size:12px;font-weight:500}
.back{font:inherit;font-size:22px;line-height:1;background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:10px;width:36px;height:36px;cursor:pointer;flex:none}
.hrep{margin-left:auto;flex:none;font:inherit;font-size:13px;font-weight:600;background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:10px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.hrep svg{width:16px;height:16px;color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.kpi{background:var(--hdr-card);border-radius:12px;padding:8px 10px}
.kpi b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi span{font-size:11px;opacity:.7}
.kpi.bad b{color:#FCA5A5} .kpi.warn b{color:#F5D565}
.demo{background:#FDE68A;color:#422006;border-radius:12px;padding:8px 12px;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.demo button{font:inherit;font-size:12px;font-weight:700;border:0;border-radius:8px;padding:6px 10px;background:#422006;color:#FDE68A;cursor:pointer}
main.in{padding-block:14px;max-width:560px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tiles .tile:last-child:nth-child(odd){grid-column:1/-1}
.tile{font:inherit;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px;min-height:64px;cursor:pointer;display:flex;align-items:center;gap:10px;position:relative;transition:transform .08s}
.tile svg{width:38px;height:38px;padding:8px;border-radius:11px;flex:none;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.tile>div{min-width:0}
.tile .nm{font-weight:700;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.tile .sb{font-size:13px;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums;margin-top:2px}
.tile .bd{position:absolute;top:-7px;right:-5px;background:var(--muted);color:#fff;font-size:12px;font-weight:800;border-radius:999px;min-width:22px;height:22px;padding:0 6px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.tile .bd.hot{background:#DC2626}
.tile:active{transform:scale(.97)}
.tile:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid #60A5FA;outline-offset:2px}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:20px 2px 8px}
h2.first{margin-top:2px}
h2{font-family:var(--f-display);font-size:15px;font-weight:700;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(14,26,54,.06)}
.row{display:grid;grid-template-columns:4px 1fr auto;gap:0 12px;padding:11px 12px 11px 0;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.row .bar{align-self:stretch;border-radius:0 3px 3px 0}
.row.tap{cursor:pointer}
.row.tap:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.row .st{font-size:13px;font-weight:600;margin-top:2px;display:flex;align-items:center;gap:4px}
.row .st.warn{color:var(--warn)} .row .st.bad{color:var(--bad)} .row .st.mut{color:var(--muted);font-weight:400}
.ic{width:14px;height:14px;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0 0 12px}
.kv dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.kv dd{margin:0;overflow-wrap:anywhere}
.sheet .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sheet .acts .btn{flex:1 1 140px}
.plan .pl{display:grid;grid-template-columns:4px auto 1fr;align-items:center;gap:0 12px;padding:11px 12px 11px 0;border-top:1px solid var(--line)}
.plan .pl .bar{align-self:stretch;border-radius:0 3px 3px 0;background:var(--gold)}
.plan .pl.done .bar{background:transparent}
.plan .pl:first-child{border-top:0}
.ledrow{cursor:pointer;border-radius:6px;padding:2px 0}
.ledrow:active{background:var(--chip)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:none;cursor:pointer;padding:0;display:grid;place-items:center}
.ck svg{width:15px;height:15px;color:var(--gold-ink);opacity:0}
.ck[aria-checked="true"]{background:var(--gold);border-color:var(--gold)}
.ck[aria-checked="true"] svg{opacity:1}
.ck:focus-visible{outline:3px solid #60A5FA;outline-offset:2px}
.pl .tx{min-width:0;font-weight:600;font-size:15px;line-height:1.35;overflow-wrap:anywhere;cursor:pointer}
.pl.done .tx{color:var(--muted);font-weight:500;text-decoration:line-through}
.plan summary{padding:10px 14px;border-top:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.carry{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,transparent);border-radius:999px;padding:2px 8px;vertical-align:2px;white-space:nowrap}
.pdays{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.pdays::-webkit-scrollbar{display:none}
.pday{flex:none;font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;position:relative}
.pday[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.pday i{font-style:normal;font-size:11px;background:var(--chip);color:var(--ink);border-radius:999px;padding:0 6px;min-width:18px;text-align:center}
.pday[aria-pressed="true"] i{background:rgba(0,0,0,.18);color:var(--gold-ink)}
.pcal{color:var(--muted)}
.pcal input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.padd{display:flex;gap:8px;padding:8px 12px 8px 16px;border-top:1px solid var(--line);align-items:center}
.padd input{flex:1;min-width:0;font:inherit;font-size:16px;border:0;background:none;color:var(--ink);padding:8px 0;outline:0}
.padd input::placeholder{color:var(--muted)}
.padd .btn{padding:7px 12px}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rtot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.rtot div{background:var(--surface);border-radius:12px;padding:8px 10px;box-shadow:0 1px 2px rgba(14,26,54,.06)}
.rtot b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.rtot span{font-size:11px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rfil{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:end}
.rfil .field{margin:0;flex:1 1 140px}
.row .main{min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.row .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.when{font-family:var(--f-num);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.mut{background:var(--chip);color:var(--muted)}
.amt{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:16px;color:var(--muted);font-size:14px}
.btn{font:inherit;font-weight:600;font-size:14px;border:0;border-radius:8px;padding:9px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.sm{font-size:12px;padding:5px 10px}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.party{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.party + .party{margin-top:8px}
.party .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.party .hd b{font-size:15px}
.mini{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.mini div{display:flex;justify-content:space-between;gap:8px}
.mini .amt{font-weight:500}
details summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600}
.note{font-size:13px;color:var(--muted);margin:0 0 4px}
nav.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.bnav .g{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.nb{font:inherit;font-size:11px;font-weight:600;background:none;border:0;color:var(--muted);padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:8px}
.nb svg{width:23px;height:23px}
.nb[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--gold)}
.nb[aria-current="page"] svg{color:#B8860B}
.nb.add .plus{width:50px;height:50px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:28px;line-height:1;margin-top:-18px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.nb:focus-visible{outline:2px solid var(--accent)}
.time{font-family:var(--f-num);font-weight:700;font-size:13px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:88vh;overflow:auto}
.sheet h3{font-family:var(--f-display);font-size:16px;margin:0 0 12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input[type=date],.field input[type=time]{-webkit-appearance:none;appearance:none;min-height:44px;text-align:left;display:block}
.field input,.field select{min-width:0;max-width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.field.chk{flex-direction:row;align-items:center;gap:8px}
.field.chk input{width:auto}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{font:inherit;text-align:left;border:0;color:#fff;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.pick button b{font-size:14px}
.pick button span{font-size:12px;opacity:.9}
pre.brief{white-space:pre-wrap;font-family:var(--f-body);font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:30}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-nav b{font-family:var(--f-display);font-size:15px;font-weight:500;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center;padding-bottom:2px}
.day{font:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:52px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);cursor:pointer}
.day .n{font-family:var(--f-num);font-size:13px;font-variant-numeric:tabular-nums}
.day.out{opacity:.35}
.day.today .n{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px}
.day[aria-pressed="true"]{border:2px solid var(--ink)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;display:block}
.dots em{font-style:normal;font-size:10px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:block}
#sync.off{color:#FCA5A5}
.login{position:fixed;inset:0;z-index:50;background:var(--hdr);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px max(24px,env(safe-area-inset-left,0px))}
.login img{width:96px;height:96px;border-radius:22px}
.login h2{color:#fff;margin:4px 0 0;font-size:22px}
.login p{color:var(--muted);margin:0;text-align:center;max-width:300px}
.login input{font:inherit;font-size:24px;letter-spacing:8px;text-align:center;width:200px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.login .btn{width:200px}
/* ---------- лаптоп / компютър ---------- */
.desk{display:none}
@media (min-width:1000px){
  body{padding-left:230px;padding-bottom:24px}
  body::before{left:230px}
  .hdr{border-radius:0 0 28px 28px}
  .hdr .in,main.in{max-width:1180px;padding-left:32px;padding-right:32px}
  .hdr .in{padding-block:22px 24px}
  h1{font-size:22px}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .kpi{padding:12px 16px}.kpi b{font-size:24px}
  main.in{padding-block:22px 40px}
  .hgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
  .mob{display:none}.desk{display:block}
  .sec.first{margin-top:6px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .tile{min-height:72px;padding:14px}
  nav.bnav{top:0;bottom:0;left:0;right:auto;width:230px;border-top:0;border-right:1px solid var(--line);padding:24px 14px;background:var(--hdr)}
  nav.bnav .g{display:flex;flex-direction:column;gap:4px;max-width:none}
  .nb{width:100%;align-self:stretch;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:11px 14px;border-radius:12px;color:var(--hdr-muted)}
  .nb:hover{background:rgba(255,255,255,.06);color:#fff}
  .nb[aria-current="page"]{box-shadow:none;background:rgba(242,194,48,.12);color:#fff}
  .nb.add{order:-1;margin-bottom:14px;background:var(--accent);color:var(--accent-ink);justify-content:center;font-weight:700}
  .nb.add:hover{background:var(--accent);color:var(--accent-ink);filter:brightness(1.08)}
  .nb.add .plus{width:auto;height:auto;margin:0;background:none;box-shadow:none;font-size:22px;color:inherit}
  .sheet-bg{align-items:center;padding:24px}
  .sheet{border-radius:18px;max-width:520px;padding:24px;max-height:86vh}
  .toast{bottom:28px;left:calc(50% + 115px)}
  .day{min-height:86px;align-items:flex-start;padding:8px}
  .rgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rtot{grid-template-columns:repeat(3,minmax(0,220px))}
  .party{padding:16px}
}
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#bbb;color-scheme:light}
  .hdr,nav.bnav,.chips,.rfil,.actions,.toast,body::before{display:none!important}
  .party,.rtot div,.list{box-shadow:none!important;border:1px solid #bbb}
  body{padding:0}
  #view::before{content:attr(data-title);display:block;font-size:18px;font-weight:700;margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){.tile:active{transform:none}}
</style>

</head>
<body>
<header class="hdr"><div class="in" id="hdr"></div></header>
<main class="in" id="view"></main>

const EMPTY=()=>({items:[],ledger:[],adv:[],meets:[],plan:[],rents:[],rentPaid:{},wash:{partners:[{name:'Аз',share:50},{name:'Съдружник',share:50}],exp:[],settle:[]}});

/* ---------- изчисления ---------- */
function balances(cat){
  const m={};
  S.ledger.filter(l=>!cat||l.cat===cat).forEach(l=>{m[l.party]??={party:l.party,cat:l.cat,bills:0,pays:0,rows:[]};
    const p=m[l.party];l.type==='bill'?p.bills+=l.amount:p.pays+=l.amount;p.rows.push(l)});
  return Object.values(m).map(p=>({...p,due:p.bills-p.pays})).sort((a,b)=>b.due-a.due);
}
const dueSum=cat=>balances(cat).reduce((s,p)=>s+Math.max(0,p.due),0);
const kasaOwes=()=>S.adv.filter(a=>!a.back).reduce((s,a)=>s+a.amount,0);
function rentDue(r){if(S.rentPaid[r.id+'|'+MONTH])return null;
  const dim=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0).getDate();return MONTH+'-'+pad(Math.min(r.day,dim))}
function upcoming(){
  const out=[];
  S.items.filter(i=>!i.done&&!waitNP(i)).forEach(i=>{const e=effDate(i),d=diff(e);if(d<=(isFiled(i)?3:remindDays(i)))out.push({type:'item',it:i,date:e,d})});
  S.rents.forEach(r=>{const due=rentDue(r);if(due&&diff(due)<=5)out.push({type:'rent',r,date:due,d:diff(due)})});
  S.meets.filter(m=>!m.done).forEach(m=>{const d=diff(m.date);if(d<=3)out.push({type:'meet',m,date:m.date,d})});
  return out.sort((a,b)=>a.d-b.d||((a.m?.time||'99')<(b.m?.time||'99')?-1:1));
}
const urgentIn=k=>upcoming().filter(u=>u.type==='item'&&u.it.dept===k);
function whenPill(d,exp){
  if(d<0)return `<span class="pill bad">${exp?'изтекло':'просрочено'} ${-d} д.</span>`;
  if(d===0)return '<span class="pill bad">днес</span>';
  if(d===1)return '<span class="pill warn">утре</span>';
  if(d<=7)return `<span class="pill warn">след ${d} д.</span>`;
  return `<span class="pill mut">след ${d} д.</span>`;
}

/* ---------- връзка със сървъра (Google Apps Script) ---------- */
const API='https://script.google.com/macros/s/AKfycbwbcP3Mji6bXs477D7l9eUoXzXeogfDJLoXP7oZj-ct1rbVktfOEA3kFz_CTkxxDGKj/exec';
const COLS=['items','ledger','adv','meets','plan','rents','wexp','settle','rentPaid','cfg'];
let PIN='';try{PIN=localStorage.getItem('mz_pin')||''}catch(e){}
let OUT=[];try{OUT=JSON.parse(localStorage.getItem('mz_out')||'[]')}catch(e){}
let BASE={};try{BASE=JSON.parse(localStorage.getItem('mz_base')||'{}')}catch(e){}
let online=null,busy=false,again=false;
function toCols(s){return{items:s.items,ledger:s.ledger,adv:s.adv,meets:s.meets,plan:s.plan,rents:s.rents,wexp:s.wash.exp,settle:s.wash.settle,
  rentPaid:Object.entries(s.rentPaid).map(([id,date])=>({id,date})),cfg:[{id:'partners',v:s.wash.partners}]}}
function fromCols(d){const c=k=>(d[k]||[]).map(x=>{const o={...x};delete o.u;delete o.del;return o});
  const p=c('cfg').find(x=>x.id==='partners');
  return{items:c('items'),ledger:c('ledger'),adv:c('adv'),meets:c('meets'),plan:c('plan'),rents:c('rents'),
    rentPaid:Object.fromEntries(c('rentPaid').map(x=>[x.id,x.date])),
    wash:{partners:p?p.v:[{name:'Аз',share:50},{name:'Съдружник',share:50}],exp:c('wexp'),settle:c('settle')}}}
function snap(s){const o={},cs=toCols(s);COLS.forEach(k=>{o[k]={};cs[k].forEach(x=>o[k][x.id]=JSON.stringify(x))});return o}
function persistSync(){try{localStorage.setItem('mz_out',JSON.stringify(OUT));localStorage.setItem('mz_base',JSON.stringify(BASE))}catch(e){}}
function queueChanges(){
  const now=Date.now(),cur=snap(S);
  COLS.forEach(k=>{const a=BASE[k]||{},b=cur[k];
    for(const id in b)if(a[id]!==b[id])OUT.push({c:k,id,u:now,json:b[id]});
    for(const id in a)if(!(id in b))OUT.push({c:k,id,u:now,del:true});});
  BASE=cur;persistSync();
}
const syncLbl=()=>online===false?`офлайн${OUT.length?' · '+OUT.length+' чакащи':''}`:OUT.length?'записва…':online?'синхронизирано':'свързва…';
function showSync(){const el=document.getElementById('sync');if(el){el.textContent=syncLbl();el.className=online===false?'off':''}}
const typing=()=>{const a=document.activeElement;return document.querySelector('.sheet-bg')||(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))};
async function flush(){
  if(!PIN||API.startsWith('ПОСТАВИ'))return;
  if(busy){again=true;return}
  busy=true;const ops=OUT.slice();
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({pin:PIN,ops})});
    const j=await r.json();
    if(!j.ok){if(j.err==='pin'){PIN='';try{localStorage.removeItem('mz_pin')}catch(e){};showLogin('Грешен ПИН')}else{online=false;toast('Грешка от сървъра: '+j.err)}}
    else{
      online=true;OUT=OUT.slice(ops.length);
      if(!OUT.length){S=fromCols(j.data);BASE=snap(S);save();if(!typing())render()}
      persistSync();
    }
  }catch(e){online=false}
  busy=false;showSync();
  if(again||OUT.length&&online){again=false;if(online)setTimeout(flush,300)}
}
function showLogin(msg){
  if(document.querySelector('.login'))return;
  const d=document.createElement('div');d.className='login';
  d.innerHTML=`<img src="icon-180.png" alt=""><h2>Моите задачи</h2><p>${msg||'Въведи ПИН кода, който си сложил в Google таблицата.'}</p><form id="lf" style="display:contents"><input id="lp" type="password" inputmode="numeric" autocomplete="current-password" aria-label="ПИН"><button class="btn">Влез</button></form>`;
  document.body.appendChild(d);
  d.querySelector('#lf').onsubmit=e=>{e.preventDefault();PIN=d.querySelector('#lp').value.trim();if(!PIN)return;try{localStorage.setItem('mz_pin',PIN)}catch(x){};d.remove();online=null;showSync();flush()};
  setTimeout(()=>d.querySelector('#lp').focus(),50);
}
function exportCsv(){
  const rows=[];$('#view').querySelectorAll('.rtot div').forEach(x=>rows.push(['Общо',x.querySelector('span').textContent,x.querySelector('b').textContent]));
  $('#view').querySelectorAll('.party').forEach(p=>{const t=p.querySelector('.hd b')?.textContent||'';
    p.querySelectorAll('.mini>div').forEach(r=>{const sp=r.querySelectorAll(':scope>span');rows.push([t,sp[0]?.innerText.replace(/\n/g,' ')||'',sp[1]?.textContent||''])})});
  const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));

function boot(){

    const n=new Date();n.setHours(0,0,0,0);if(n.getTime()!==TODAY.getTime())return location.reload();flush()});

/* ---------- начален екран ---------- */
function tileInfo(k){
  if(DEPTS[k]){const u=urgentIn(k),a=S.items.filter(i=>i.dept===k&&!i.done).length;return{bd:u.length||'',hot:u.some(x=>x.d<=1),sb:a?`${a} активни`:'няма записи'}}
  if(k==='serv'||k==='ice'){const d=dueSum(LCAT[k]);return{sb:d>0?'дължа '+eur0(d):'чисто'}}
  if(k==='kasa'){const d=kasaOwes();return{sb:d>0?eur0(d):'нищо',bd:S.adv.filter(a=>!a.back).length||''}}
  if(k==='wash'){const u=S.wash.exp.filter(e=>e.paidBy==='Неплатено');return{sb:u.length?'неплатени '+eur0(u.reduce((s,e)=>s+e.amount,0)):'изравнено',bd:u.length||'',hot:false}}
  if(k==='rent'){const n=S.rents.filter(r=>rentDue(r)).length,soon=S.rents.filter(r=>{const d=rentDue(r);return d&&diff(d)<=5});return{sb:n?`${n} неплатени`:'всички платени',bd:soon.length||'',hot:soon.some(r=>diff(rentDue(r))<=1)}}
}
const rowFor=u=>u.type==='item'?itemRow(u.it,true,true):u.type==='meet'?meetRow(u.m):rentRow(u.r);

  return `<button class="tile" style="--c:${col(k)}" data-go="${k}">${svg(k)}<div><div class="nm">${UNITS[k]}</div><div class="sb">${t.sb}</div></div>${t.bd?`<span class="bd ${t.hot?'hot':''}">${t.bd}</span>`:''}</button>`}).join('')+'</div>'}
let showAllNow=false;
const CK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
function planRow(p){const t=iso(TODAY);
  return `<div class="pl ${p.done?'done':''}"><span class="bar"></span><button class="ck" role="checkbox" aria-checked="${!!p.done}" aria-label="Отметни" data-act="pck" data-id="${p.id}">${CK}</button><div class="tx" data-act="pedit" data-id="${p.id}">${esc(p.text)}${!p.done&&p.date<t?`<span class="carry">от ${bg(p.date).slice(0,5)}</span>`:''}${p.date>t&&p.date!==planDay?`<span class="carry" style="color:var(--muted);background:var(--chip)">${diff(p.date)===1?'утре':bg(p.date).slice(0,5)}</span>`:''}</div></div>`}
let planDay=null;
const WD=['нд','пн','вт','ср','чт','пт','сб'];
function planBlock(){
  const t=iso(TODAY),d=planDay&&planDay>=t?planDay:t,isT=d===t;
  const open=S.plan.filter(p=>!p.done&&(isT?p.date<=t:p.date===d)).sort((a,b)=>a.date<b.date?-1:1),done=S.plan.filter(p=>p.done&&(isT?p.doneDate===t:p.date===d));
  const days=[...Array(7)].map((_,i)=>addDays(i));if(!days.includes(d))days.push(d);
  const cnt=x=>S.plan.filter(p=>!p.done&&(x===t?p.date<=t:p.date===x)).length;
  const lbl=x=>{const k=diff(x);return k===0?'Днес':k===1?'Утре':WD[parse(x).getDay()]+' '+parse(x).getDate()};
  const title=isT?'План за днес':diff(d)===1?'План за утре':'План за '+parse(d).toLocaleDateString('bg-BG',{weekday:'long',day:'numeric',month:'long'});
  return `<h2 class="first">${title} <small>${done.length} от ${open.length+done.length} отметнати</small></h2>
  <div class="pdays">${days.map(x=>`<button class="pday" aria-pressed="${x===d}" data-pday="${x}">${lbl(x)}${cnt(x)?`<i>${cnt(x)}</i>`:''}</button>`).join('')}<label class="pday pcal" aria-label="Друга дата">${ico('clock').replace('class="ic"','class="ic" style="width:16px;height:16px"')}<input type="date" id="pdayPick" min="${t}" value="${d}"></label></div>
  <div class="list plan">${open.map(planRow).join('')}${done.map(planRow).join('')}${!open.length&&!done.length?`<div class="empty">${isT?'Нищо за днес.':'Още няма задачи за този ден.'}</div>`:''}<form class="padd" id="planAdd"><input id="planIn" placeholder="${isT?'Добави задача за днес…':'Добави задача за '+lbl(d).toLowerCase()+'…'}" autocomplete="off" enterkeyhint="done"><button class="btn sm">Добави</button></form></div>`;
}
function vPlan(){
  const t=iso(TODAY),fut=S.plan.filter(p=>!p.done&&p.date>t).sort((a,b)=>a.date<b.date?-1:1),g={};
  fut.forEach(p=>(g[p.date]??=[]).push(p));

function vHome(){

/* ---------- редове ---------- */
function mainAct(i){
  if(i.done)return `<button class="btn ghost sm" data-act="undo" data-id="${i.id}">Върни</button>`;
  if(isFiled(i))return `<button class="btn sm" data-act="pickup" data-id="${i.id}">Взех го</button>`;
  if(waitNP(i))return `<button class="btn sm" data-act="np" data-id="${i.id}">Получих НП</button>`;
  if(isFine(i))return `<button class="btn sm" data-act="finepay" data-id="${i.id}">Платено</button>`;
  if(EXPIRY.includes(i.kind))return `<button class="btn sm" data-act="file" data-id="${i.id}">Подадох</button>`;
  return `<button class="btn sm" data-act="done" data-id="${i.id}">${i.kind==='Предписание'?'Изпълнено':'Готово'}</button>`;
}
function itemRow(i,acts=true,showDept=false){
  const exp=EXPIRY.includes(i.kind),fl=isFiled(i),d=diff(effDate(i));
  const sub=[(showDept?DEPTS[i.dept].name+' · ':'')+i.kind+(i.time?' · '+i.time:''),i.muni,i.store,i.place].filter(Boolean).map(esc).join(' · ');
  const st=fl?`<div class="st warn">${ico('doc')}Вземи разрешителното от общината</div>`:waitNP(i)?`<div class="st mut">${ico('clock')}Чака наказателно постановление</div>`:isFine(i)?`<div class="st warn">${ico('kasa')}${i.kind==='АУАН'?'Глоба':'Сума'} ${eur(fineAmt(i)||0)}</div>`:(i.done&&i.paid)?`<div class="st mut">Платено ${eur(i.paid.amount)} на ${bg(i.paid.date)}</div>`:(i.dept==='pol'&&!i.poa&&!i.done)?`<div class="st bad">${ico('warn')}Няма пълномощно${i.firm?' — '+esc(i.firm):''}</div>`:'';
  return `<div class="row tap" data-open="i:${i.id}"><span class="bar" style="background:${col(i.dept)}"></span><div class="main"><div class="t">${esc(i.title)}</div><div class="s">${sub}</div>${st}</div><div class="r"><span class="when">${fl?'вземи ':exp?'до ':waitNP(i)?'съставен ':isFine(i)?'плати до ':i.kind==='Предписание'&&!i.done?'срок ':''}${bg(effDate(i))}</span>${i.done?'<span class="pill ok">готово</span>':waitNP(i)?'<span class="pill mut">чака НП</span>':whenPill(d,exp&&!fl)}${acts||i.done?mainAct(i):''}</div></div>`;
}

function brief(){
  const up=upcoming();
  let t=`Добро утро! ${TODAY.toLocaleDateString('bg-BG',{weekday:'long',day:'numeric',month:'long'})}\n\n`;
  const line=u=>u.type==='meet'?`• ${u.m.time?u.m.time+' ':''}${u.m.title}${u.m.place?' — '+u.m.place:''} (${bg(u.date)})`:u.type==='item'?isFiled(u.it)?`• Вземи разрешително (${u.it.kind}) — ${u.it.place||u.it.title} (${bg(u.date)})`:isFine(u.it)?`• ${DEPTS[u.it.dept].name}: плати ${u.it.kind==='АУАН'?'глоба':'споразумение'} ${eur(fineAmt(u.it)||0)} — ${u.it.place||u.it.title} (до ${bg(u.date)})`:`• ${DEPTS[u.it.dept].name}: ${u.it.title}${u.it.place?' — '+u.it.place:''} (${bg(u.date)})${u.it.dept==='pol'&&!u.it.poa?' ⚠ пълномощно!':''}`:`• Наем: ${u.r.obj} — ${eur(u.r.amount)} (до ${bg(u.date)})`;
  [['ПРОСРОЧЕНО',u=>u.d<0],['ДНЕС И УТРЕ',u=>u.d>=0&&u.d<=1],['ПРЕДСТОИ',u=>u.d>1]].forEach(([n,f])=>{const a=up.filter(f);if(a.length)t+=n+'\n'+a.map(line).join('\n')+'\n\n'});
  const pt=S.plan.filter(p=>!p.done&&p.date<=iso(TODAY));
  if(pt.length)t+='ПЛАН ЗА ДНЕС\n'+pt.map(p=>`☐ ${p.text}${p.date<iso(TODAY)?' (от '+bg(p.date).slice(0,5)+')':''}`).join('\n')+'\n\n';
  t+=`ПАРИ\n• Касата ми дължи: ${eur(kasaOwes())}\n`+balances().filter(p=>p.due>0).map(p=>`• Дължа на ${p.party}: ${eur(p.due)}`).join('\n');
  return t;
}
function showBrief(){
  const b=document.createElement('div');b.className='sheet-bg';
  b.innerHTML=`<div class="sheet"><h3>Сутрешно резюме</h3><pre class="brief" id="bt">${esc(brief())}</pre><p class="note" style="margin-top:8px">Резюме на деня — можеш да го копираш и пратиш.</p><div class="foot"><button class="btn ghost" id="cp">Копирай</button><button class="btn" id="bx">Затвори</button></div></div>`;
  document.body.appendChild(b);
  b.addEventListener('click',e=>{if(e.target===b||e.target.id==='bx')b.remove()});
  b.querySelector('#cp').onclick=()=>{const el=b.querySelector('#bt');
    (navigator.clipboard?navigator.clipboard.writeText(el.textContent):Promise.reject()).then(()=>toast('Копирано'),()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)})};
}

/* ---------- събития ---------- */
document.querySelector('nav.bnav').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(!b)return;const n=b.dataset.nav;
  if(n==='add')return addFor(route);
  if(n==='rep')repT=null;
  if(n==='cal'){calM=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);calSel=iso(TODAY)}
  go(n)});
$('#hdr').addEventListener('click',e=>{
  if(e.target.closest('#repBtn')){repT=null;return go('rep')}
  if(e.target.closest('#backBtn')){if(route==='rep'&&repT){repT=null;return go('rep')}go('home')}
  else if(false){S={demo:false,plan:[],meets:[],items:[],ledger:[],adv:[],wash:{partners:[{name:'Аз',share:50},{name:'Съдружник',share:50}],exp:[]},rents:[],rentPaid:{}};commit('Примерите са изчистени')}
});
$('#view').addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g)return go(g.dataset.go);
  if(e.target.closest('#clearDemo')){S={demo:false,plan:[],meets:[],items:[],ledger:[],adv:[],wash:{partners:[{name:'Аз',share:50},{name:'Съдружник',share:50}],exp:[]},rents:[],rentPaid:{}};return commit('Примерите са изчистени')}
  const rp=e.target.closest('[data-rep]');if(rp){repT=rp.dataset.rep;repF='';return render()}
  const pr=e.target.closest('[data-per]');if(pr){repP=pr.dataset.per;return render()}
  if(e.target.closest('[data-pdf]')){window.print();return}
  if(e.target.closest('[data-csv]')){exportCsv();return}
  if(e.target.closest('[data-copy]')){const el=$('#rtxt'),txt=el.textContent;(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Копирано'),()=>{el.hidden=false;const r=document.createRange();r.selectNodeContents(el);const sl=getSelection();sl.removeAllRanges();sl.addRange(r)});return}
  const pdb=e.target.closest('[data-pday]');if(pdb){planDay=pdb.dataset.pday;return render()}
  if(e.target.closest('[data-more]')){showAllNow=!showAllNow;return render()}
  const dy=e.target.closest('[data-day]');if(dy){calSel=dy.dataset.day;const d=parse(calSel);if(d.getMonth()!==calM.getMonth())calM=new Date(d.getFullYear(),d.getMonth(),1);return render()}
  const cm=e.target.closest('[data-cm]');if(cm){calM=new Date(calM.getFullYear(),calM.getMonth()+Number(cm.dataset.cm),1);return render()}
  const b=e.target.closest('[data-act]');
  if(!b){const o=e.target.closest('[data-open]');if(o){const [t,id]=o.dataset.open.split(':');t==='i'?itemDetail(S.items.find(x=>x.id===id)):meetDetail(S.meets.find(x=>x.id===id))}return}
  doAct(b);
});
function doAct(b){
  const id=b.dataset.id,a=b.dataset.act,it=S.items.find(i=>i.id===id);
  if(a==='done'){it.done=true;commit('Готово')}
  else if(a==='renew')renewForm(it);
  else if(a==='file')fileForm(it);
  else if(a==='pickup')pickupForm(it);
  else if(a==='np')npForm(it);
  else if(a==='finepay')finePayForm(it);
  else if(a==='fee')feeForm(it);
  else if(a==='feedel'){it.fees=it.fees.filter(f=>f.id!==b.dataset.fee);commit('Таксата е изтрита')}
  else if(a==='edit')itemForm(it.dept,it);
  else if(a==='undo'){it.done=false;delete it.paid;commit('Върнато в активни')}
  else if(a==='mundo'){S.meets.find(x=>x.id===id).done=false;commit('Върнато в предстоящи')}
  else if(a==='mdone'){S.meets.find(x=>x.id===id).done=true;commit('Готово')}
  else if(a==='medit')meetForm(S.meets.find(x=>x.id===id));
  else if(a==='back'){Object.assign(S.adv.find(x=>x.id===id),{back:true,backDate:iso(TODAY)});commit('Върнато от касата')}
  else if(a==='backall'){S.adv.forEach(x=>{if(!x.back){x.back=true;x.backDate=iso(TODAY)}});commit('Всичко е върнато')}
  else if(a==='ledit')ledgerEdit(S.ledger.find(x=>x.id===id));
  else if(a==='lren')ledgerRename(b.dataset.party);
  else if(a==='bill'||a==='pay')ledgerForm(route,a,b.dataset.party);
  else if(a==='pck'){const p=S.plan.find(x=>x.id===id);p.done=!p.done;if(p.done)p.doneDate=iso(TODAY);else delete p.doneDate;commit()}
  else if(a==='pedit')planForm(S.plan.find(x=>x.id===id));
  else if(a==='washexp')washForm();
  else if(a==='washedit')washForm(S.wash.exp.find(x=>x.id===id));
  else if(a==='partners')partnersForm();
  else if(a==='settle')settleForm();
  else if(a==='settledel'){S.wash.settle=S.wash.settle.filter(x=>x.id!==id);commit('Изтрито')}
  else if(a==='washpay'){const ex=S.wash.exp.find(x=>x.id===id);sheet('Кой плати?',[{k:'paidBy',l:'Платил',type:'select',o:S.wash.partners.map(p=>p.name)}],v=>{ex.paidBy=v.paidBy;ex.date=iso(TODAY)})}
  else if(a==='rentpay'){S.rentPaid[id+'|'+MONTH]=iso(TODAY);commit('Наемът е платен')}
  else if(a==='rentundo'){delete S.rentPaid[id+'|'+MONTH];commit()}
}
$('#view').addEventListener('submit',e=>{
  if(e.target.id!=='planAdd')return;e.preventDefault();
  const v=$('#planIn').value.trim();if(!v){const t=iso(TODAY);return planForm(null,planDay&&planDay>t?planDay:t)}
  const t=iso(TODAY);S.plan.push({id:uid(),text:v,date:planDay&&planDay>t?planDay:t});commit();
  const i=$('#planIn');if(i)i.focus();
});
$('#view').addEventListener('change',e=>{
  if(e.target.id==='pdayPick'&&e.target.value){planDay=e.target.value;return render()}
  if(e.target.id==='rff'){repF=e.target.value;render()}
  if(e.target.id==='rf1'){repFrom=e.target.value;render()}
  if(e.target.id==='rf2'){repTo=e.target.value;render()}
});
boot();
</script>
